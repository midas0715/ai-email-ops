server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The API limits uploads to 5 MB; leave room for the form overhead
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Docker's built-in DNS. With it, nginx looks up "api" again when the container is recreated.
    resolver 127.0.0.11 valid=10s;

    # /api/auth/login  ->  http://api:8000/auth/login
    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI requests can be slow, especially while the model loads (the nginx default is 60 s)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Built files have a hash in their name, so they can be cached for a long time
    location /assets/ {
        expires 1y;
    }

    # index.html must never be cached, or visitors would keep an old version
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths show index.html so React Router can handle them
    location / {
        try_files $uri /index.html;
    }
}